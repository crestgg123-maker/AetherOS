<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090d18" />
    <title>AetherOS</title>
    <script src="/scramjet/scramjet.js"></script>
    <script src="/controller/controller.api.js"></script>
  </head>
  <body>
    <header class="topbar">
      <button id="brand-home" class="brand" type="button" aria-label="AetherOS home">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none">
            <path d="M16 3 28 25H4L16 3Z" fill="currentColor" opacity=".96" />
            <path d="m16 12 7 13H9l7-13Z" fill="#101426" />
            <path d="m16 18 4 7h-8l4-7Z" fill="currentColor" />
          </svg>
        </span>
        <span class="brand-name">Aether<span>OS</span></span>
      </button>
      <div class="topbar-label">
        <span class="status-dot"></span>
        <span>YOUR WEB SPACE</span>
      </div>
    </header>

    <div class="app-body">
      <aside class="sidebar" aria-label="Main navigation">
        <p class="sidebar-heading">WORKSPACE</p>
        <nav class="side-nav">
          <button class="nav-item" type="button" data-view="home" aria-current="page">
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <path d="m3 9 7-6 7 6v8H4V9m4 8v-5h4v5" />
            </svg>
            <span>Home</span>
          </button>
          <button class="nav-item" type="button" data-view="browser" aria-current="false">
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <rect x="2.5" y="3" width="15" height="14" rx="2" />
              <path d="M3 7h14M6 5h.01M8.5 5h.01" />
            </svg>
            <span>Browser</span>
          </button>
        </nav>
        <div class="sidebar-footer">
          <span class="sidebar-orbit" aria-hidden="true">✦</span>
          <span>Make the web yours</span>
        </div>
      </aside>

      <main class="content-area">
        <section id="home-page" class="home-page">
          <div class="home-content">
            <div class="hero-kicker">
              <span class="hero-kicker-mark" aria-hidden="true">✦</span>
              <span>WELCOME TO AETHEROS</span>
            </div>
            <h1>Find your next <span>somewhere.</span></h1>
            <p class="hero-copy">Search, discover, and pick up right where you left off.</p>

            <form id="home-search-form" class="home-search-form">
              <label class="home-engine-picker">
                <span class="sr-only">Search engine</span>
                <select id="home-search-engine" aria-label="Home search engine">
                  <option value="bing">Bing</option>
                  <option value="duckduckgo">DuckDuckGo</option>
                </select>
              </label>
              <label class="home-address-field">
                <svg viewBox="0 0 20 20" aria-hidden="true">
                  <circle cx="8.7" cy="8.7" r="5.7" />
                  <path d="m13 13 4 4" />
                </svg>
                <span class="sr-only">Search or enter a URL</span>
                <input
                  id="home-address"
                  type="text"
                  placeholder="What are you looking for?"
                  autocomplete="off"
                  spellcheck="false"
                  aria-label="Search or enter a URL"
                />
              </label>
              <button class="home-search-button" type="submit" aria-label="Search">
                <svg viewBox="0 0 20 20" aria-hidden="true">
                  <path d="M4 10h11M10 5l5 5-5 5" />
                </svg>
              </button>
            </form>
            <p id="home-status" class="home-status" role="status" aria-live="polite"></p>

            <div class="shortcuts-heading">
              <div>
                <span class="section-kicker">QUICK LAUNCH</span>
                <h2>Jump right in</h2>
              </div>
              <span class="shortcut-count">4 shortcuts</span>
            </div>
            <div class="shortcut-grid">
              <button class="shortcut-card discord-card" type="button" data-url="https://discord.com/app">
                <span class="shortcut-icon">D</span>
                <span class="shortcut-copy"><strong>Discord</strong><small>Hang out with your community</small></span>
                <span class="shortcut-arrow" aria-hidden="true">↗</span>
              </button>
              <button class="shortcut-card youtube-card" type="button" data-url="https://www.youtube.com/">
                <span class="shortcut-icon">▶</span>
                <span class="shortcut-copy"><strong>YouTube</strong><small>Watch something interesting</small></span>
                <span class="shortcut-arrow" aria-hidden="true">↗</span>
              </button>
              <button class="shortcut-card geforce-card" type="button" data-url="https://play.geforcenow.com/">
                <span class="shortcut-icon">G</span>
                <span class="shortcut-copy"><strong>GeForce NOW</strong><small>Play from the cloud</small></span>
                <span class="shortcut-arrow" aria-hidden="true">↗</span>
              </button>
              <button class="shortcut-card gmail-card" type="button" data-url="https://mail.google.com/">
                <span class="shortcut-icon">M</span>
                <span class="shortcut-copy"><strong>Gmail</strong><small>Open your inbox</small></span>
                <span class="shortcut-arrow" aria-hidden="true">↗</span>
              </button>
            </div>
            <p class="home-footnote">Shortcuts open in your AetherOS browser.</p>
          </div>
        </section>

        <section id="browser-page" class="browser-page" hidden>
          <div class="browser-shell">
            <form id="search-form">
              <label class="engine-picker">
                <span class="sr-only">Search engine</span>
                <select id="search-engine" aria-label="Search engine">
                  <option value="bing">Bing</option>
                  <option value="duckduckgo">DuckDuckGo</option>
                </select>
                <svg viewBox="0 0 20 20" aria-hidden="true">
                  <path d="m5 7.5 5 5 5-5" />
                </svg>
              </label>
              <span class="search-divider" aria-hidden="true"></span>
              <label class="address-field">
                <svg viewBox="0 0 20 20" aria-hidden="true">
                  <circle cx="8.7" cy="8.7" r="5.7" />
                  <path d="m13 13 4 4" />
                </svg>
                <span class="sr-only">Search or enter a URL</span>
                <input
                  id="address"
                  type="text"
                  placeholder="Search the web or enter a URL"
                  autocomplete="off"
                  spellcheck="false"
                  aria-label="Search or enter a URL"
                />
              </label>
              <button class="search-button" type="submit">
                <span>Search</span>
                <svg viewBox="0 0 20 20" aria-hidden="true">
                  <path d="M4 10h11M10 5l5 5-5 5" />
                </svg>
              </button>
              <button id="new-tab" class="new-tab-button" type="button">
                <span aria-hidden="true">+</span>
                <span>New tab</span>
              </button>
            </form>

            <div class="workspace-row">
              <div id="tabs" role="tablist" aria-label="Open pages"></div>
              <p id="status" role="status" aria-live="polite"></p>
            </div>
            <section id="pages" aria-label="Browser pages"></section>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
